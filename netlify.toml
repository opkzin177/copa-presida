[build]
  publish = "public"
  functions = "netlify/functions"
  # Injeta o script InfinitePay no index antes de publicar
  command = "grep -q infinitepay.js public/index.html || sed -i 's|</body>|<script src=\"/infinitepay.js\"></script></body>|' public/index.html"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[dev]
  publish = "public"
  functions = "netlify/functions"
  port = 8888
